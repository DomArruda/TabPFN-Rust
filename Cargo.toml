[workspace]
members = ["crates/tabpfn-core", "crates/tabpfn-wasm", "crates/tabpfn-py"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
candle-core = { version = "0.10", features = [] }
candle-nn = { version = "0.10", features = [] }
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
